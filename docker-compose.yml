services:
  agent:
    build: .
    environment:
      MODEL_PROVIDER: ${MODEL_PROVIDER:-heuristic}
      MODEL_NAME: ${MODEL_NAME:-gpt-4.1-mini}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
    volumes:
      - ./data/input:/app/data/input:ro
      - ./kb:/app/kb:ro
      - ./outputs:/app/outputs
      - ./logs:/app/logs

  ollama:
    image: ollama/ollama:latest
    profiles: ["local-llm"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  ollama-pull:
    image: ollama/ollama:latest
    profiles: ["local-llm"]
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull '${LOCAL_MODEL:-qwen2.5:3b}'"]
    restart: "no"

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    profiles: ["local-llm"]
    depends_on:
      ollama:
        condition: service_healthy
    ports:
      - "3001:8080"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      WEBUI_AUTH: "False"
      WEBUI_NAME: Seekr FDE Local Model Lab
    volumes:
      - open_webui_data:/app/backend/data
    restart: unless-stopped

volumes:
  ollama_data:
  open_webui_data:
