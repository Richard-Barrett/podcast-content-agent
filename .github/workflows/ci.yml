name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check app tests

      - name: Run tests
        run: python -m pytest -q

      - name: Smoke test agent
        env:
          MODEL_PROVIDER: heuristic
        run: |
          rm -rf /tmp/seekr-output /tmp/seekr-logs
          python -m app.main \
            --input data/input \
            --output /tmp/seekr-output \
            --kb kb/facts.json \
            --logs /tmp/seekr-logs
          test -f /tmp/seekr-output/ep001_analysis.json
          test -f /tmp/seekr-output/ep002_analysis.json
          test -f /tmp/seekr-output/ep003_analysis.json
          test -f /tmp/seekr-logs/agent.log

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose stack
        run: docker compose --profile local-llm config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: seekr-fde-podcast-agent:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image
        run: |
          docker run --rm \
            -e MODEL_PROVIDER=heuristic \
            seekr-fde-podcast-agent:ci \
            --input data/input \
            --output /tmp/outputs \
            --kb kb/facts.json \
            --logs /tmp/logs

  publish:
    name: Publish GHCR image
    if: github.event_name == 'push'
    needs: [test, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and publish
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
